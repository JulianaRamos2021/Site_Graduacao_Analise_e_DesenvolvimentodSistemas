<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encontre Serviços Locais</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header class="hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>🔍 Encontre um prestador de serviço local</h1>
            <p>Profissionais da sua cidade, a um clique de distância</p>
            <a href="cadastro.html" class="botao-secundario">📨 Cadastre seu serviço</a>
        </div>
    </header>

    <main class="container">
        <input type="text" id="busca" placeholder="Buscar por nome, serviço ou cidade..." />
        <div id="lista-servicos" class="lista"></div>
    </main>

    <script>
        const lista = document.getElementById("lista-servicos");
        const busca = document.getElementById("busca");
        let dados = [];

        fetch("https://api.sheetbest.com/sheets/980dd929-d016-460b-9a49-0346f7b3d726")
            .then(res => res.json())
            .then(data => {
                dados = data.reverse();
                renderizarLista(dados);
            });

        busca.addEventListener("input", () => {
            const termo = busca.value.toLowerCase();
            const filtrado = dados.filter(item =>
                item.nome.toLowerCase().includes(termo) ||
                item.servico.toLowerCase().includes(termo) ||
                item.cidade.toLowerCase().includes(termo)
            );
            renderizarLista(filtrado);
        });

        function renderizarLista(listaDados) {
            lista.innerHTML = "";
            listaDados.forEach(item => {
                lista.innerHTML += `
          <div class="card">
            <div class="card-body">
              <h3>👤 ${item.nome}</h3>
              <p><strong>Serviço:</strong> ${item.servico}</p>
              <p><strong>Local:</strong> ${item.cidade}</p>
              <p><strong>Contato:</strong> ${item.telefone}</p>
              <p><em>${item.descricao}</em></p>
            </div>
          </div>
        `;
            });
        }
    </script>
</body>

</html>
